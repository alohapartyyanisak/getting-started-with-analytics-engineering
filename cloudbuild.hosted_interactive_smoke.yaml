steps:
  - name: mcr.microsoft.com/playwright:v1.59.1-jammy
    entrypoint: bash
    env:
      - APP_URL=${_APP_URL}
      - SMOKE_ARTISTS=${_SMOKE_ARTISTS}
      - SMOKE_MAX_ATTEMPTS=1
      - SMOKE_SERIES_ID=${_SMOKE_SERIES_ID}
      - SMOKE_PROFILE=${_SMOKE_PROFILE}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    args:
      - -lc
      - |
        set -euo pipefail
        mkdir -p recommendation_app/go-live/code/prod/.artifacts
        npm init -y >/dev/null 2>&1
        npm install --no-save playwright@1.59.1 >/dev/null 2>&1
        set +e
        node recommendation_app/go-live/code/prod/hosted_interactive_smoke.mjs | tee recommendation_app/go-live/code/prod/.artifacts/hosted_interactive_smoke_result.json
        smoke_exit=${PIPESTATUS[0]}
        set -e
        echo "smoke_exit=${smoke_exit}"
        node -e "const fs=require('fs'); const path='recommendation_app/go-live/code/prod/.artifacts/hosted_interactive_smoke_result.json'; if (fs.existsSync(path)) { const payload=JSON.parse(fs.readFileSync(path,'utf8')); console.log('__SMOKE_RESULT__=' + JSON.stringify(payload)); } else { console.log('__SMOKE_RESULT__=' + JSON.stringify({status:'fail', error:'missing_result_json'})); }"
        exit "${smoke_exit}"
timeout: 1800s
