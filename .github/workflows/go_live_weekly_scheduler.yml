name: go-live-weekly-scheduler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler mode"
        required: false
        default: "problem_queue_bounded"
      problem_max_rows:
        description: "Max problem rows (bounded mode)"
        required: false
        default: "1200"
      problem_max_resolve_keys:
        description: "Max resolver keys (bounded mode)"
        required: false
        default: "400"
      post_smoke:
        description: "Run post-run smoke gate"
        required: false
        default: "true"
      notify_on:
        description: "Notification groups (ok,error or error)"
        required: false
        default: "error"
  schedule:
    # Weekly Monday 07:00 UTC
    - cron: "0 7 * * 1"

concurrency:
  group: go-live-weekly-scheduler
  cancel-in-progress: false

jobs:
  run-weekly-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      GO_LIVE_DATASET_STORAGE_ROOT: recommendation_app/go-live/data/storage
      GO_LIVE_DATASET_POINTER_FILE: latest.json
      GCS_DATASET_URI: ${{ secrets.GCS_DATASET_URI }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PROD_SCHED_MODE: ${{ github.event.inputs.mode || 'problem_queue_bounded' }}
      PROD_SCHED_PROBLEM_MAX_ROWS: ${{ github.event.inputs.problem_max_rows || '1200' }}
      PROD_SCHED_PROBLEM_MAX_RESOLVE_KEYS: ${{ github.event.inputs.problem_max_resolve_keys || '400' }}
      PROD_SCHED_POST_SMOKE: ${{ github.event.inputs.post_smoke || 'true' }}
      PROD_SCHED_AUTO_PROMOTE: "false"
      PROD_SCHED_NOTIFY_ON: ${{ github.event.inputs.notify_on || 'error' }}
      PROD_SCHED_NOTIFY_URL: ${{ secrets.PROD_SCHED_NOTIFY_URL }}
      PROD_SCHED_NOTIFY_BEARER_TOKEN: ${{ secrets.PROD_SCHED_NOTIFY_BEARER_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auth to Google Cloud (Workload Identity)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Auth to Google Cloud (Service Account Key)
        if: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || secrets.GCP_SERVICE_ACCOUNT == '') && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate required cloud settings
        run: |
          set -euo pipefail
          test -n "${GCS_DATASET_URI}"
          test -n "${GCP_PROJECT_ID}"

      - name: Sync storage from GCS
        run: |
          set -euo pipefail
          mkdir -p "${GO_LIVE_DATASET_STORAGE_ROOT}"
          gcloud storage rsync --recursive "${GCS_DATASET_URI}" "${GO_LIVE_DATASET_STORAGE_ROOT}"
          test -f "${GO_LIVE_DATASET_STORAGE_ROOT}/${GO_LIVE_DATASET_POINTER_FILE}"

      - name: Run scheduler entrypoint
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python recommendation_app/go-live/code/prod/scheduled_job_entrypoint.py | tee .artifacts/scheduler_result.json

      - name: Print scheduler summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".artifacts/scheduler_result.json")
          if not path.exists():
              print("scheduler_result.json is missing")
              raise SystemExit(0)
          text = path.read_text(encoding="utf-8", errors="replace")
          i = text.find("{")
          if i < 0:
              print("No JSON payload found")
              raise SystemExit(0)
          payload = json.loads(text[i:])
          n = payload.get("notification") if isinstance(payload.get("notification"), dict) else {}
          print("run_id=", payload.get("run_id"))
          print("status=", payload.get("status"))
          print("candidate_dataset_version=", payload.get("candidate_dataset_version"))
          print("pointer_after=", (payload.get("pointer_after") or {}).get("dataset_version"))
          print("notification.sent=", n.get("sent"))
          print("notification.http_status=", n.get("http_status"))
          print("notification.reason=", n.get("reason"))
          PY

      - name: Sync storage back to GCS
        if: always()
        run: |
          set -euo pipefail
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            "${GO_LIVE_DATASET_STORAGE_ROOT}" "${GCS_DATASET_URI}"

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-weekly-scheduler-${{ github.run_id }}
          path: |
            .artifacts/scheduler_result.json
            recommendation_app/go-live/data/storage/prod_runs/*.json
