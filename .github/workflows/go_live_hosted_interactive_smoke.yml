name: go-live-hosted-interactive-smoke

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional app URL override; blank resolves from Cloud Run service"
        required: false
        default: ""
      cloud_run_service_override:
        description: "Optional Cloud Run service override for isolated test targets"
        required: false
        default: ""
      target_label:
        description: "Short label for artifact naming, e.g. developer or lighter"
        required: false
        default: "developer"
      artists:
        description: "Pipe-delimited artist seeds to add during smoke"
        required: false
        default: "Ed Sheeran|Bruno Mars"

concurrency:
  group: go-live-hosted-interactive-smoke
  cancel-in-progress: false

jobs:
  run-hosted-interactive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      APP_URL_INPUT: ${{ github.event.inputs.app_url || '' }}
      CLOUD_RUN_SERVICE_OVERRIDE: ${{ github.event.inputs.cloud_run_service_override || '' }}
      TARGET_LABEL: ${{ github.event.inputs.target_label || 'developer' }}
      SMOKE_ARTISTS: ${{ github.event.inputs.artists || 'Ed Sheeran|Bruno Mars' }}
      SMOKE_SERIES_ID: gcp-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (Workload Identity)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Auth to Google Cloud (Service Account Key)
        if: ${{ (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve app URL
        id: resolve_url
        run: |
          set -euo pipefail
          APP_URL="${APP_URL_INPUT}"
          SERVICE_NAME="${CLOUD_RUN_SERVICE_OVERRIDE}"
          if [ -z "${SERVICE_NAME}" ]; then
            SERVICE_NAME="${CLOUD_RUN_SERVICE}"
          fi
          if [ -z "${APP_URL}" ]; then
            test -n "${GCP_REGION}"
            test -n "${SERVICE_NAME}"
            APP_URL="$(gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" --format='value(status.url)')"
          fi
          test -n "${APP_URL}"
          echo "app_url=${APP_URL}" >> "${GITHUB_OUTPUT}"
          echo "service_name=${SERVICE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "app_url=${APP_URL}"
          echo "service_name=${SERVICE_NAME}"

      - name: Run hosted interactive smoke in Cloud Build
        env:
          APP_URL: ${{ steps.resolve_url.outputs.app_url }}
        run: |
          set -euo pipefail
          mkdir -p recommendation_app/go-live/code/prod/.artifacts
          gcloud builds submit \
            --project "${GCP_PROJECT_ID}" \
            --config cloudbuild.hosted_interactive_smoke.yaml \
            --substitutions "_APP_URL=${APP_URL},_SMOKE_ARTISTS=${SMOKE_ARTISTS},_SMOKE_SERIES_ID=${SMOKE_SERIES_ID}" \
            . | tee recommendation_app/go-live/code/prod/.artifacts/cloudbuild_hosted_interactive_smoke.log

      - name: Extract hosted interactive smoke result from Cloud Build log
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          log_path = Path("recommendation_app/go-live/code/prod/.artifacts/cloudbuild_hosted_interactive_smoke.log")
          result_path = Path("recommendation_app/go-live/code/prod/.artifacts/hosted_interactive_smoke_result.json")
          if not log_path.exists():
            raise SystemExit(0)

          text = log_path.read_text(encoding="utf-8", errors="replace")
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          for line in reversed(lines):
            if line.startswith("__SMOKE_RESULT__="):
              result_path.write_text(line.split("=", 1)[1] + "\n", encoding="utf-8")
              break
          PY

      - name: Print hosted interactive smoke summary
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = 'recommendation_app/go-live/code/prod/.artifacts/hosted_interactive_smoke_result.json';
          if (!fs.existsSync(path)) {
            console.log('hosted_interactive_smoke_result.json is missing');
            process.exit(0);
          }
          const text = fs.readFileSync(path, 'utf8');
          const idx = text.indexOf('{');
          if (idx < 0) {
            console.log('No JSON payload found');
            process.exit(0);
          }
          const payload = JSON.parse(text.slice(idx));
          console.log('status=', payload.status);
          console.log('app_url=', payload.app_url);
          console.log('service_name=', process.env.SERVICE_NAME || '');
          console.log('target_label=', process.env.TARGET_LABEL || '');
          console.log('artists=', (payload.artists || []).join(', '));
          console.log('page_loaded=', payload.checks?.page_loaded);
          console.log('artist_mode_ready=', payload.checks?.artist_mode_ready);
          console.log('artist_selection_persists=', payload.checks?.artist_selection_persists);
          console.log('final_pick_box_updated=', payload.checks?.final_pick_box_updated);
          console.log('playable_playlist_visible=', payload.checks?.playable_playlist_visible);
          console.log('temp_playlist_link_visible=', payload.checks?.temp_playlist_link_visible);
          JS

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-hosted-interactive-smoke-${{ env.TARGET_LABEL }}-${{ github.run_id }}
          path: recommendation_app/go-live/code/prod/.artifacts/
          include-hidden-files: true
