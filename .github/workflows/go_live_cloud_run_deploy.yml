name: go-live-cloud-run-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override"
        required: false
        default: ""
      deploy_environment:
        description: "Deploy environment label"
        required: false
        default: "staging"
      app_variant:
        description: "App variant to deploy: developer or lighter"
        required: false
        default: "developer"
      cloud_run_service_override:
        description: "Optional Cloud Run service override for isolated deploys"
        required: false
        default: ""
      public_base_url:
        description: "Optional public base URL override for smoke checks"
        required: false
        default: ""

concurrency:
  group: go-live-cloud-run-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      CLOUD_RUN_MEMORY: ${{ vars.CLOUD_RUN_MEMORY }}
      CLOUD_RUN_CONCURRENCY: ${{ vars.CLOUD_RUN_CONCURRENCY }}
      GCS_DATASET_URI: ${{ secrets.GCS_DATASET_URI }}
      GO_LIVE_DATASET_STORAGE_ROOT: /tmp/go-live/data/storage
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
      LANGSMITH_API_URL: ${{ vars.LANGSMITH_API_URL }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      APP_VARIANT: ${{ github.event.inputs.app_variant || 'developer' }}
      CLOUD_RUN_SERVICE_OVERRIDE: ${{ github.event.inputs.cloud_run_service_override || '' }}
      PUBLIC_BASE_URL_OVERRIDE: ${{ github.event.inputs.public_base_url || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Auth to Google Cloud (Workload Identity)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Auth to Google Cloud (Service Account Key)
        if: ${{ (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate deploy settings
        run: |
          set -euo pipefail
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_REGION}"
          test -n "${GAR_REPOSITORY}"
          test -n "${CLOUD_RUN_SERVICE}"
          test -n "${GCS_DATASET_URI}"
          if [ -z "${CLOUD_RUN_MEMORY}" ]; then
            CLOUD_RUN_MEMORY="2Gi"
          fi
          if [ -z "${CLOUD_RUN_CONCURRENCY}" ]; then
            CLOUD_RUN_CONCURRENCY="1"
          fi
          if [ "${APP_VARIANT}" != "developer" ] && [ "${APP_VARIANT}" != "lighter" ]; then
            echo "Unsupported APP_VARIANT=${APP_VARIANT}" >&2
            exit 1
          fi

      - name: Resolve deploy service
        id: service_meta
        run: |
          set -euo pipefail
          SERVICE_NAME="${CLOUD_RUN_SERVICE_OVERRIDE}"
          if [ -z "${SERVICE_NAME}" ]; then
            SERVICE_NAME="${CLOUD_RUN_SERVICE}"
          fi
          echo "service_name=${SERVICE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "service_name=${SERVICE_NAME}"

      - name: Configure Docker auth
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE_URI}" .

      - name: Push image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          APP_ENTRYPOINT="recommendation_app/go-live/code/application_phase2.py"
          if [ "${APP_VARIANT}" = "lighter" ]; then
            APP_ENTRYPOINT="recommendation_app/go-live/code/prod/application_phase2_lighter_UI.py"
          fi
          {
            echo "GCS_DATASET_URI: \"${GCS_DATASET_URI}\""
            echo "GO_LIVE_SYNC_FROM_GCS: \"true\""
            echo "GO_LIVE_DATASET_STORAGE_ROOT: \"${GO_LIVE_DATASET_STORAGE_ROOT}\""
            echo "GO_LIVE_APP_ENTRYPOINT: \"${APP_ENTRYPOINT}\""
            echo "GO_LIVE_APP_TRACE_ENABLED: \"true\""
            echo "GO_LIVE_TRACE_ENVIRONMENT: \"${{ github.event.inputs.deploy_environment }}\""
            echo "LANGSMITH_PROJECT: \"${LANGSMITH_PROJECT}\""
            echo "LANGSMITH_API_URL: \"${LANGSMITH_API_URL}\""
            echo "LANGSMITH_API_KEY: \"${LANGSMITH_API_KEY}\""
          } > "${ENV_FILE}"
          gcloud run deploy "${{ steps.service_meta.outputs.service_name }}" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --memory "${CLOUD_RUN_MEMORY:-2Gi}" \
            --concurrency "${CLOUD_RUN_CONCURRENCY:-1}" \
            --cpu-boost \
            --session-affinity \
            --env-vars-file "${ENV_FILE}" \
            --labels "app=dj-mixing-station,component=go-live,environment=${{ github.event.inputs.deploy_environment }}"

      - name: Capture deploy summary
        id: deploy_summary
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$(mktemp)"
          gcloud run services describe "${{ steps.service_meta.outputs.service_name }}" --region "${GCP_REGION}" --format=json > "${SERVICE_JSON}"
          URL="$(jq -r '.status.url // ""' "${SERVICE_JSON}")"
          REVISION="$(jq -r '.status.latestReadyRevisionName // ""' "${SERVICE_JSON}")"
          MEMORY="$(jq -r '.spec.template.spec.containers[0].resources.limits.memory // ""' "${SERVICE_JSON}")"
          CONCURRENCY="$(jq -r '.spec.template.spec.containerConcurrency // ""' "${SERVICE_JSON}")"
          SESSION_AFFINITY="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/sessionAffinity"] // ""' "${SERVICE_JSON}")"
          PUBLIC_URL="${PUBLIC_BASE_URL_OVERRIDE}"
          if [ -z "${PUBLIC_URL}" ] && [ "${{ steps.service_meta.outputs.service_name }}" = "${CLOUD_RUN_SERVICE}" ]; then
            PUBLIC_URL="${APP_BASE_URL}"
          fi
          if [ -z "${PUBLIC_URL}" ]; then
            PUBLIC_URL="${URL}"
          fi
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "public_url=${PUBLIC_URL}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "service=${{ steps.service_meta.outputs.service_name }}"
          echo "app_variant=${APP_VARIANT}"
          echo "image=${IMAGE_URI}"
          echo "url=${URL}"
          echo "public_url=${PUBLIC_URL}"
          echo "revision=${REVISION}"
          echo "memory=${MEMORY}"
          echo "concurrency=${CONCURRENCY}"
          echo "session_affinity=${SESSION_AFFINITY}"

      - name: Run hosted smoke check
        run: |
          set -euo pipefail
          python recommendation_app/go-live/code/prod/cloud_run_smoke_check.py \
            --base-url "${{ steps.deploy_summary.outputs.public_url }}" \
            --attempts 18 \
            --sleep-seconds 5 \
            --timeout-seconds 20
