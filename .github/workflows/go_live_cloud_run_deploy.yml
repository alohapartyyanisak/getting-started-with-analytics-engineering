name: go-live-cloud-run-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override"
        required: false
        default: ""
      deploy_environment:
        description: "Deploy environment label"
        required: false
        default: "staging"

concurrency:
  group: go-live-cloud-run-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_MEMORY: ${{ vars.CLOUD_RUN_MEMORY }}
      CLOUD_RUN_CONCURRENCY: ${{ vars.CLOUD_RUN_CONCURRENCY }}
      GCS_DATASET_URI: ${{ secrets.GCS_DATASET_URI }}
      GO_LIVE_DATASET_STORAGE_ROOT: /tmp/go-live/data/storage
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
      LANGSMITH_API_URL: ${{ vars.LANGSMITH_API_URL }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Auth to Google Cloud (Workload Identity)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Auth to Google Cloud (Service Account Key)
        if: ${{ (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate deploy settings
        run: |
          set -euo pipefail
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_REGION}"
          test -n "${GAR_REPOSITORY}"
          test -n "${CLOUD_RUN_SERVICE}"
          test -n "${GCS_DATASET_URI}"
          if [ -z "${CLOUD_RUN_MEMORY}" ]; then
            CLOUD_RUN_MEMORY="2Gi"
          fi
          if [ -z "${CLOUD_RUN_CONCURRENCY}" ]; then
            CLOUD_RUN_CONCURRENCY="1"
          fi

      - name: Configure Docker auth
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE_URI}" .

      - name: Push image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          {
            echo "GCS_DATASET_URI: \"${GCS_DATASET_URI}\""
            echo "GO_LIVE_SYNC_FROM_GCS: \"true\""
            echo "GO_LIVE_DATASET_STORAGE_ROOT: \"${GO_LIVE_DATASET_STORAGE_ROOT}\""
            echo "GO_LIVE_APP_TRACE_ENABLED: \"true\""
            echo "GO_LIVE_TRACE_ENVIRONMENT: \"${{ github.event.inputs.deploy_environment }}\""
            echo "LANGSMITH_PROJECT: \"${LANGSMITH_PROJECT}\""
            echo "LANGSMITH_API_URL: \"${LANGSMITH_API_URL}\""
            echo "LANGSMITH_API_KEY: \"${LANGSMITH_API_KEY}\""
          } > "${ENV_FILE}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --memory "${CLOUD_RUN_MEMORY:-2Gi}" \
            --concurrency "${CLOUD_RUN_CONCURRENCY:-1}" \
            --cpu-boost \
            --session-affinity \
            --env-vars-file "${ENV_FILE}" \
            --labels "app=dj-mixing-station,component=go-live,environment=${{ github.event.inputs.deploy_environment }}"

      - name: Capture deploy summary
        id: deploy_summary
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/go-live-app:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --format=json > "${SERVICE_JSON}"
          URL="$(python - "${SERVICE_JSON}" <<'PY'
import json, sys
payload = json.load(open(sys.argv[1], encoding="utf-8"))
print((((payload.get("status") or {}).get("url")) or "").strip())
PY
)"
          REVISION="$(python - "${SERVICE_JSON}" <<'PY'
import json, sys
payload = json.load(open(sys.argv[1], encoding="utf-8"))
print((((payload.get("status") or {}).get("latestReadyRevisionName")) or "").strip())
PY
)"
          MEMORY="$(python - "${SERVICE_JSON}" <<'PY'
import json, sys
payload = json.load(open(sys.argv[1], encoding="utf-8"))
containers = (((payload.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers") or []
limits = ((containers[0] if containers else {}).get("resources") or {}).get("limits") or {}
print((limits.get("memory") or "").strip())
PY
)"
          CONCURRENCY="$(python - "${SERVICE_JSON}" <<'PY'
import json, sys
payload = json.load(open(sys.argv[1], encoding="utf-8"))
value = (((payload.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containerConcurrency")
print("" if value is None else str(value))
PY
)"
          SESSION_AFFINITY="$(python - "${SERVICE_JSON}" <<'PY'
import json, sys
payload = json.load(open(sys.argv[1], encoding="utf-8"))
annotations = (((payload.get("spec") or {}).get("template") or {}).get("metadata") or {}).get("annotations") or {}
print((annotations.get("run.googleapis.com/sessionAffinity") or "").strip())
PY
)"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "service=${CLOUD_RUN_SERVICE}"
          echo "image=${IMAGE_URI}"
          echo "url=${URL}"
          echo "revision=${REVISION}"
          echo "memory=${MEMORY}"
          echo "concurrency=${CONCURRENCY}"
          echo "session_affinity=${SESSION_AFFINITY}"

      - name: Run hosted smoke check
        run: |
          set -euo pipefail
          python recommendation_app/go-live/code/prod/cloud_run_smoke_check.py \
            --base-url "${{ steps.deploy_summary.outputs.url }}" \
            --attempts 18 \
            --sleep-seconds 5 \
            --timeout-seconds 20
