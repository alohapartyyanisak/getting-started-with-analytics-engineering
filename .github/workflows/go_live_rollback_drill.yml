name: go-live-rollback-drill

on:
  workflow_dispatch:
    inputs:
      rollback_revision:
        description: "Optional Cloud Run revision to test; blank uses previous ready revision"
        required: false
        default: ""
      attempts:
        description: "Hosted smoke attempts per app drill stage"
        required: false
        default: "12"
      sleep_seconds:
        description: "Sleep between smoke attempts"
        required: false
        default: "3"
      timeout_seconds:
        description: "HTTP timeout per smoke request"
        required: false
        default: "15"

concurrency:
  group: go-live-rollback-drill
  cancel-in-progress: false

jobs:
  run-rollback-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    env:
      GO_LIVE_DATASET_STORAGE_ROOT: recommendation_app/go-live/data/storage
      GO_LIVE_DATASET_POINTER_FILE: latest.json
      GCS_DATASET_URI: ${{ vars.GCS_DATASET_URI || secrets.GCS_DATASET_URI }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      ROLLBACK_REVISION: ${{ github.event.inputs.rollback_revision || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auth to Google Cloud (Workload Identity)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Auth to Google Cloud (Service Account Key)
        if: ${{ (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate required settings
        run: |
          set -euo pipefail
          test -n "${GCS_DATASET_URI}"
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_REGION}"
          test -n "${CLOUD_RUN_SERVICE}"

      - name: Sync storage from GCS
        run: |
          set -euo pipefail
          mkdir -p "${GO_LIVE_DATASET_STORAGE_ROOT}"
          gcloud storage rsync --recursive "${GCS_DATASET_URI}" "${GO_LIVE_DATASET_STORAGE_ROOT}"
          test -f "${GO_LIVE_DATASET_STORAGE_ROOT}/${GO_LIVE_DATASET_POINTER_FILE}"

      - name: Run rollback drill
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python recommendation_app/go-live/code/prod/run_rollback_drill.py \
            --service "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --rollback-revision "${ROLLBACK_REVISION}" \
            --attempts "${{ github.event.inputs.attempts || '12' }}" \
            --sleep-seconds "${{ github.event.inputs.sleep_seconds || '3' }}" \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds || '15' }}" \
            | tee .artifacts/rollback_drill_result.json

      - name: Print rollback drill summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.artifacts/rollback_drill_result.json')
          if not path.exists():
              print('rollback_drill_result.json is missing')
              raise SystemExit(0)
          text = path.read_text(encoding='utf-8', errors='replace')
          i = text.find('{')
          if i < 0:
              print('No JSON payload found')
              raise SystemExit(0)
          payload = json.loads(text[i:])
          print('status=', payload.get('status'))
          print('dataset.current_version=', ((payload.get('dataset') or {}).get('current_version')))
          print('dataset.target_version=', ((payload.get('dataset') or {}).get('target_version')))
          print('app.before_live_revision=', ((payload.get('app') or {}).get('before_live_revision')))
          print('app.rollback_revision=', ((payload.get('app') or {}).get('rollback_revision')))
          print('app.after_live_revision=', ((payload.get('app') or {}).get('after_live_revision')))
          PY

      - name: Sync storage back to GCS
        if: always()
        run: |
          set -euo pipefail
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            "${GO_LIVE_DATASET_STORAGE_ROOT}" "${GCS_DATASET_URI}"

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-rollback-drill-${{ github.run_id }}
          path: |
            .artifacts/rollback_drill_result.json
            recommendation_app/go-live/data/storage/prod_rollbacks/*.json
