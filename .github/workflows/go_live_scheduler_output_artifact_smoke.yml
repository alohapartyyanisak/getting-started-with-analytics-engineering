name: go-live-scheduler-output-artifact-smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler mode for artifact smoke"
        required: false
        default: "full"
      timeout_seconds:
        description: "Publish timeout seconds"
        required: false
        default: "300"
      problem_max_rows:
        description: "Max problem rows (problem queue modes)"
        required: false
        default: "50"
      problem_max_resolve_keys:
        description: "Max resolver keys (problem queue modes)"
        required: false
        default: "20"

concurrency:
  group: go-live-scheduler-output-artifact-smoke
  cancel-in-progress: false

jobs:
  run-scheduler-output-artifact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kagglehub

      - name: Run scheduler output artifact smoke
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python recommendation_app/go-live/code/prod/scheduler_output_artifact_smoke.py \
            --mode "${{ github.event.inputs.mode || 'full' }}" \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds || '300' }}" \
            --problem-max-rows "${{ github.event.inputs.problem_max_rows || '50' }}" \
            --problem-max-resolve-keys "${{ github.event.inputs.problem_max_resolve_keys || '20' }}" \
            | tee .artifacts/scheduler_output_artifact_smoke.json

      - name: Print smoke summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".artifacts/scheduler_output_artifact_smoke.json")
          if not path.exists():
              print("scheduler_output_artifact_smoke.json is missing")
              raise SystemExit(0)
          text = path.read_text(encoding="utf-8", errors="replace")
          i = text.find("{")
          if i < 0:
              print("No JSON payload found")
              raise SystemExit(0)
          payload = json.loads(text[i:])
          result = payload.get("orchestrator_result") or {}
          print("status=", payload.get("status"))
          print("mode=", result.get("mode"))
          print("candidate_dataset_version=", result.get("candidate_dataset_version"))
          print("validation_rows_path=", result.get("validation_rows_path"))
          print("queue_current_path=", result.get("unresolved_queue_current_path"))
          print("queue_summary_path=", result.get("unresolved_queue_summary_path"))
          PY

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-scheduler-output-artifact-smoke-${{ github.run_id }}
          path: |
            .artifacts/scheduler_output_artifact_smoke.json
